name: Deploy to VPS

# Runs after Test_Application has passed on main, or by hand.
# Only in the webcrunch fork: the server's deploy keys must not be reachable from the group repo.
on:
  workflow_run:
    workflows: [ "Test_Application" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'webcrunch/wordSlayer' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Import secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.jarllindquist.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/server-deploy SSH_HOST | SERVER_HOST ;
            kv/data/server-deploy SSH_USERNAME | SERVER_USER ;
            kv/data/server-deploy SERVER_PORT | SERVER_PORT ;
            kv/data/server-deploy SSH_PRIVATE_KEY | SERVER_PRIVATE_KEY ;
            kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
            kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD ;
            kv/data/server-deploy SSH_HOST_FINGERPRINT | SSH_HOST_FINGERPRINT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=registry,ref=passwordnotsafe/wordslayer:latest
          cache-to: type=inline
          build-args: |
            VITE_BASE_PATH=/wordslayer/
          tags: |
            passwordnotsafe/wordslayer:latest
            passwordnotsafe/wordslayer:${{ github.event.workflow_run.head_sha || github.sha }}

      # The two appleboy steps receive the server's SSH key: pinned to a commit, and they check the
      # server against the fingerprint in Vault instead of trusting any host at the address.
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          fingerprint: ${{ env.SSH_HOST_FINGERPRINT }}
          source: "docker-compose.prod.yml"
          target: "/home/repos/wordslayer"

      - name: Start on VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_PRIVATE_KEY }}
          port: ${{ env.SERVER_PORT }}
          fingerprint: ${{ env.SSH_HOST_FINGERPRINT }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -e
            cd /home/repos/wordslayer
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            # The login is only needed for the pull; do not leave the password on the server.
            docker logout
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Check that the game answers
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://jarllindquist.com/wordslayer/health; then exit 0; fi
            sleep 5
          done
          echo "jarllindquist.com/wordslayer/health did not answer"
          exit 1
